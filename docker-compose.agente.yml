# CH-19c2 (DEC-120, DEC-123 A7): the agent, on the customer's host, next to the replica.
# Never run it together with docker-compose.yml: this machine needs no engine secret, and
# the default `docker compose up` is unchanged.
#   cp .env.agente.example .env.agente   # fill it in; never commit it
#   docker compose -f docker-compose.agente.yml --env-file .env.agente up -d --build
# Compose refuses to start when a variable is unset or empty, and names it without a value.
#
# Deployment note (DEC-122 Q7):
# - Never expose the engine's application port to untrusted networks.
# - Terminate TLS in a reverse proxy whose idle timeout is above the engine's 20 s ping.
# - AGENT_SERVER_URL must be wss://. ws:// is accepted only for loopback, and inside this
#   container loopback is the container itself, so it only serves local tests.
#
# Reaching the replica: AGENT_ALLOWED_TARGETS is resolved from inside the container.
# `localhost` there is the container, not the host. Use the replica's DNS name or IP on
# the customer's network, a service name on a shared Docker network, or, for a replica on
# this same host, host.docker.internal (on Linux, add the extra_hosts line below).
#
# Exit 1 (configuration), 2 (credentials rejected or agent revoked) and 3 (replaced by
# another instance with the same token) need the operator; Docker restarts with growing delays.
name: zerodashboard-agente

services:
  agente:
    build:
      context: .
      target: agente
    environment:
      AGENT_SERVER_URL: ${AGENT_SERVER_URL:?AGENT_SERVER_URL is required}
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
      AGENT_ALLOWED_TARGETS: ${AGENT_ALLOWED_TARGETS:?AGENT_ALLOWED_TARGETS is required}
    # extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
