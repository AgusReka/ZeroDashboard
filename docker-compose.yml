services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${NODE_ENV}
      # Required since CH-07 (DEC-17). It is forwarded rather than baked into the image:
      # a key in the image would travel with every copy of it. Without it the container
      # refuses to start, which is the intended fail-closed behaviour, not a defect.
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
      # Optional since CH-13 (DEC-77): the one zone every automation schedule is read in.
      # Unset or empty, the app falls back to its documented default (`UTC`).
      ZONA_HORARIA_AUTOMATIZACIONES: ${ZONA_HORARIA_AUTOMATIZACIONES:-}
      # Optional since CH-14 (DEC-81, DEC-86): the SMTP server run notifications go out
      # through. Forwarded, never given a value here. SMTP_HOST unset or empty means email
      # is not configured and every run records notificacion='no-configurada'; with
      # SMTP_HOST set, the rest must be valid or the container refuses to start.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-}
    ports:
      - "${APP_PORT}:${APP_PORT}"

  # CH-14 (DEC-81): local mail catcher for development. It starts only with the profile,
  # `docker compose --profile correo up`; the default `docker compose up` is unchanged.
  # The app has no depends_on on it, so email stays optional. Inside the Compose network
  # the app reaches it as SMTP_HOST=mailpit, SMTP_PORT=1025 (no TLS, no credentials).
  # The host ports default to 1026 (SMTP) and 8026 (web UI) rather than Mailpit's usual
  # 1025/8025, so they do not collide with another Mailpit already on the machine; both
  # are overridable and bound to localhost only.
  mailpit:
    image: axllent/mailpit:v1.31.2
    profiles: ["correo"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"

volumes:
  db-data:
