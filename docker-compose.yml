services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${NODE_ENV}
      # Required since CH-07 (DEC-17). It is forwarded rather than baked into the image:
      # a key in the image would travel with every copy of it. Without it the container
      # refuses to start, which is the intended fail-closed behaviour, not a defect.
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
    ports:
      - "${APP_PORT}:${APP_PORT}"

volumes:
  db-data:
