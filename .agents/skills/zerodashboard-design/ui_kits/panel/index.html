<!-- @dsCard group="Panel" viewport="1200x900" name="Panel (P2)" subtitle="Administrador PYME · mis automatizaciones, ajustes, último resultado" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroDashboard — Panel</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../datos-muestra.js"></script>
</head>
<body class="zd-root" data-surface="panel">
<div id="root"></div>
<script type="text/babel" src="PanelShell.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
function App() {
  const D = window.DATOS_MUESTRA;
  const [route, setRoute] = React.useState(() => JSON.parse(localStorage.getItem('zd-panel-route') || '{"s":"lista"}'));
  const go = r => { setRoute(r); localStorage.setItem('zd-panel-route', JSON.stringify(r)); window.scrollTo(0, 0); };
  const auto = route.id ? D.panel.find(a => a.id === route.id) : null;
  if (route.s === 'ingreso') return <ScreenIngreso onIngresar={() => go({ s: 'lista' })} />;
  let body = <ScreenMisAutomatizaciones onAjustar={a => go({ s: 'ajustes', id: a.id })} onResultado={a => go({ s: 'resultado', id: a.id })} />;
  if (route.s === 'ajustes' && auto) body = <ScreenAjustes auto={auto} onVolver={() => go({ s: 'lista' })} />;
  if (route.s === 'resultado' && auto) body = <ScreenResultado auto={auto} onVolver={() => go({ s: 'lista' })} />;
  return <PanelShell sesion={D.sesion} onSalir={() => go({ s: 'ingreso' })}>{body}</PanelShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
