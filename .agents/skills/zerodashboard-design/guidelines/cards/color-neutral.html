<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:6px;border:1px solid var(--border-1)}.n{font-size:12px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-3)}.g{display:grid;gap:12px}</style></head><body class="zd-root"><div class="g" style="grid-template-columns:repeat(12,1fr)"><div class="sw"><div class="chip" style="background:var(--gray-0)"></div><div class="n">0</div><div class="v">--gray-0</div></div><div class="sw"><div class="chip" style="background:var(--gray-25)"></div><div class="n">25</div><div class="v">--gray-25</div></div><div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="n">50</div><div class="v">--gray-50</div></div><div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="n">100</div><div class="v">--gray-100</div></div><div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="n">200</div><div class="v">--gray-200</div></div><div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="n">300</div><div class="v">--gray-300</div></div><div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="n">400</div><div class="v">--gray-400</div></div><div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="n">500</div><div class="v">--gray-500</div></div><div class="sw"><div class="chip" style="background:var(--gray-600)"></div><div class="n">600</div><div class="v">--gray-600</div></div><div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="n">700</div><div class="v">--gray-700</div></div><div class="sw"><div class="chip" style="background:var(--gray-800)"></div><div class="n">800</div><div class="v">--gray-800</div></div><div class="sw"><div class="chip" style="background:var(--g
